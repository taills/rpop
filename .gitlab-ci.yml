stages:
  - build-and-push

variables:
  DOCKER_IMAGE_NAME: "${DOCKER_REGISTRY_HOST}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}"
  RUNNER_SCRIPT_TIMEOUT: 1h
  RUNNER_AFTER_SCRIPT_TIMEOUT: 1h

# ── 构建并推送镜像（原生单架构：产出跟随构建机架构；仅推送私有 registry，不做部署）──
build-and-push:
  stage: build-and-push
  before_script:
    - echo $DOCKER_REGISTRY_PASSWORD | docker login -u $DOCKER_REGISTRY_USERNAME --password-stdin $DOCKER_REGISTRY_HOST
  after_script:
    - docker logout $DOCKER_REGISTRY_HOST
  script:
    # 确定 Docker 标签（优先 Git tag，否则分支名，并清理特殊字符）
    - if [ -n "$CI_COMMIT_TAG" ]; then DOCKER_TAG=$CI_COMMIT_TAG; else DOCKER_TAG=$CI_COMMIT_REF_NAME; fi
    - export DOCKER_TAG=$(echo $DOCKER_TAG | sed 's/[^a-zA-Z0-9._-]/-/g')
    # 渲染 Dockerfile 里的 ${DOCKER_REGISTRY_MIRROR}（其余变量交给 Docker ARG 处理）
    - envsubst '${CI_PROJECT_NAME} ${DOCKER_REGISTRY_MIRROR}' < Dockerfile > Dockerfile.rendered
    # 构建（tag 只打版本；main/dev 分支额外打 latest）
    - echo "Building $CI_PROJECT_NAME image with tag $DOCKER_TAG"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker build -f Dockerfile.rendered \
          --build-arg VERSION=$DOCKER_TAG \
          -t $DOCKER_IMAGE_NAME:$DOCKER_TAG \
          .
      else
        docker build -f Dockerfile.rendered \
          --build-arg VERSION=$DOCKER_TAG \
          -t $DOCKER_IMAGE_NAME:$DOCKER_TAG \
          -t $DOCKER_IMAGE_NAME:latest \
          .
      fi
    # 推送
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_TAG
    - if [ -z "$CI_COMMIT_TAG" ]; then docker push $DOCKER_IMAGE_NAME:latest; fi
    # 清理悬空镜像
    - docker image rm $(docker images -f "dangling=true" -q) || true
  only:
    - main
    - dev
    - tags
